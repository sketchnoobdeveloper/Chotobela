name: Chotobela Arcade CI

on:
  push:
    branches: [ main ]
    paths: [ 'emulator/**', '.github/workflows/ci-emulator.yml' ]
  pull_request:
    branches: [ main ]
    paths: [ 'emulator/**' ]
  workflow_dispatch:

jobs:
  build:
    name: Build arcade shell APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Android SDK components
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "ndk;28.2.13676358" "cmake;3.22.1" "platforms;android-36" "platform-tools" \
            > /dev/null

      - name: Build debug APK
        working-directory: emulator/android-MAME4droid
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: chotobela-arcade-debug-apk
          path: emulator/android-MAME4droid/app/build/outputs/apk/debug/*.apk
          retention-days: 14
