name: Chotobela Arcade CI

on:
  push:
    branches: [ main ]
    paths: [ 'emulator/**', '.github/workflows/ci-emulator.yml' ]
  pull_request:
    branches: [ main ]
    paths: [ 'emulator/**' ]
  workflow_dispatch:

jobs:
  build:
    name: Build arcade shell APK
    runs-on: ubuntu-latest
    timeout-minutes: 300

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Android SDK components
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "ndk;28.2.13676358" "cmake;3.22.1" "platforms;android-36" "platform-tools" \
            > /dev/null

      - name: Merge upstream MAME sources with overlay
        run: |
          mkdir -p /tmp/up && curl -sfL             https://codeload.github.com/mamedev/mame/tar.gz/refs/tags/mame0289             | tar -xz --strip-components=1 -C /tmp/up
          mkdir -p emulator/merged-src
          rsync -a /tmp/up/ emulator/merged-src/
          rsync -a emulator/src-overlay/ emulator/merged-src/
          echo "MAME_SRC_ROOT=$GITHUB_WORKSPACE/emulator/merged-src" >> $GITHUB_ENV

      - name: Generate MAME font/layout headers
        run: |
          pip install pillow -q || true
          M=emulator/merged-src; B=$M/scripts/build
          mkdir -p $M/src/emu/ui $M/src/emu/layout
          python3 $B/file2str.py $M/scripts/font/NotoSans-Bold.bdc $M/src/emu/uismall.fh font_uismall uint8_t
          python3 $B/png2bdc.py $M/src/frontend/mame/ui/uicmd14.png /tmp/cmd.bdc
          python3 $B/file2str.py /tmp/cmd.bdc $M/src/emu/ui/uicmd14.fh font_uicmd14 uint8_t
          for L in noscreens monitors dualhovu dualhsxs dualhuov triphsxs quadhsxs; do
            python3 $B/complay.py $M/src/emu/layout/$L.lay $M/src/emu/layout/$L.lh $L
          done

      - name: Build debug APK (full MAME core)
        working-directory: emulator/android-MAME4droid
        env:
          MAME_SRC_ROOT: ${{ env.MAME_SRC_ROOT }}
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: chotobela-arcade-debug-apk
          path: emulator/android-MAME4droid/app/build/outputs/apk/debug/*.apk
          retention-days: 14
